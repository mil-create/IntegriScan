environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  image_picker: ^1.0.0
  crop: ^0.5.0
  flutter:
    sdk: flutter
  provider: ^6.1.2
  cupertino_icons: ^1.0.6
